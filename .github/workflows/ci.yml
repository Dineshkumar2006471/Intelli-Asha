name: IntelliASHA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter (Code Quality Check)
      run: npm run lint

    - name: Security Scan (npm audit)
      run: npm audit --audit-level=high

    - name: Run Type Check (Frontend)
      run: npm run typecheck

    - name: Run Type Check (Functions)
      working-directory: ./functions
      run: npm run lint

    - name: Run Unit Tests with Coverage (Frontend)
      run: npm run test -- --coverage --run
      env:
        VITE_FIREBASE_API_KEY: "ci-dummy-key"
        VITE_FIREBASE_AUTH_DOMAIN: "ci-dummy-domain"
        VITE_FIREBASE_PROJECT_ID: "ci-dummy-id"
        VITE_FIREBASE_STORAGE_BUCKET: "ci-dummy-bucket"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "ci-dummy-sender"
        VITE_FIREBASE_APP_ID: "ci-dummy-app-id"
        VITE_GOOGLE_MAPS_API_KEY: "ci-dummy-maps-key"

    - name: Build Production Bundle
      run: npm run build
      env:
        VITE_FIREBASE_API_KEY: "ci-dummy-key"
        VITE_FIREBASE_AUTH_DOMAIN: "ci-dummy-domain"
        VITE_FIREBASE_PROJECT_ID: "ci-dummy-id"
        VITE_FIREBASE_STORAGE_BUCKET: "ci-dummy-bucket"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "ci-dummy-sender"
        VITE_FIREBASE_APP_ID: "ci-dummy-app-id"
        VITE_GOOGLE_MAPS_API_KEY: "ci-dummy-maps-key"

    - name: Run Unit Tests (Functions)
      working-directory: ./functions
      run: npm run test -- --run

    - name: Verify Docker Build
      run: docker build -t intelliasha:ci .

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

  validate-firestore-rules:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate Firestore Rules Syntax
      run: |
        npm install -g firebase-tools
        firebase --project=demo-intelliasha emulators:exec --only firestore "echo 'Firestore rules validated'"
      continue-on-error: true

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Firebase
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: kavach-hackathon-500511
          channelId: live
      - name: Deploy Functions
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
